<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Horse</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#eee;
    background:
        linear-gradient(rgba(5,5,5,.62),rgba(5,5,5,.78)),
        url("./stable.jpeg") center/cover fixed;
}

/* HEADER */
.site-header{
    position:fixed;top:0;left:0;width:100%;height:78px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 45px;background:#050505;
    border-bottom:1px solid #8f6b32;z-index:9999;
}
.logo{
    display:flex;align-items:center;gap:10px;
    color:#d6b06a;font-family:Georgia,serif;
    font-size:28px;font-weight:bold;
}
.logo-icon{font-size:38px}
.main-nav{display:flex;align-items:center;gap:42px}
.main-nav a{
    color:#d6b06a;text-decoration:none;
    font-family:Georgia,serif;font-size:17px;
    transition:color .3s ease;
}
.main-nav a:hover,.main-nav a.active{color:white}
.menu-toggle{
    display:none;background:none;border:none;
    color:#d6b06a;font-size:30px;cursor:pointer;
}
.menu-toggle.open{color:white}
.explore-menu{display:none}

/* CONTACT */
main{
    min-height:100vh;display:flex;justify-content:center;align-items:center;
    padding:130px 25px 70px;
}
.contact-wrapper{
    width:100%;max-width:560px;padding:38px;
    background:rgba(10,10,10,.58);
    border:1px solid rgba(214,176,106,.45);
    border-radius:22px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 20px 60px rgba(0,0,0,.55),
               inset 0 1px 0 rgba(255,255,255,.08);
}
.contact-title{
    margin-bottom:8px;color:#f0d08a;
    font-family:Georgia,serif;font-size:38px;text-align:center;
}
.contact-subtitle{
    margin-bottom:30px;color:#d5d5d5;
    font-size:15px;line-height:1.7;text-align:center;
}

/* FORM */
.contact-form{display:flex;flex-direction:column;gap:9px}
.contact-form label{
    margin-top:8px;color:#d6b06a;
    font-family:Georgia,serif;font-size:16px;
}
.contact-form input,.contact-form textarea{
    width:100%;padding:13px 15px;
    color:white;background:rgba(0,0,0,.45);
    border:1px solid rgba(214,176,106,.38);
    border-radius:10px;outline:none;
    font-family:Arial,sans-serif;font-size:15px;
    transition:border-color .3s,background .3s,box-shadow .3s;
}
.contact-form input::placeholder,
.contact-form textarea::placeholder{color:#999}
.contact-form input:focus,.contact-form textarea:focus{
    background:rgba(0,0,0,.62);
    border-color:#d6b06a;
    box-shadow:0 0 12px rgba(214,176,106,.15);
}
.contact-form textarea{min-height:120px;resize:vertical}
.send-button{
    margin-top:18px;padding:13px 25px;
    color:#17120b;background:#d6b06a;
    border:none;border-radius:25px;
    font-size:16px;font-weight:bold;cursor:pointer;
    transition:transform .3s,background .3s,box-shadow .3s;
}
.send-button:hover{
    background:#f0d08a;transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

/* SOCIAL */
.social-section{
    margin-top:35px;padding-top:25px;
    border-top:1px solid rgba(214,176,106,.22);
    text-align:center;
}
.social-section h2{
    margin-bottom:8px;color:#d6b06a;
    font-family:Georgia,serif;font-size:22px;
}
.social-section p{margin-bottom:18px;color:#aaa;font-size:14px}
.social-links{
    display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
}
.social-link{
    display:inline-block;padding:10px 18px;
    color:#d6b06a;background:rgba(0,0,0,.35);
    border:1px solid rgba(214,176,106,.4);
    border-radius:22px;text-decoration:none;
    font-family:Georgia,serif;font-size:14px;
    transition:background .3s,color .3s,transform .3s;
}
.social-link:hover{
    color:#080808;background:#d6b06a;transform:translateY(-3px);
}

/* MOBILE */
@media(max-width:768px){
    .site-header{height:68px;padding:0 20px}
    .logo{font-size:21px}
    .logo-icon{font-size:28px}
    .explore-menu{
        display:block;margin-left:auto;margin-right:10px;
        color:#d6b06a;font-family:Georgia,serif;
        font-size:13px;opacity:.85;
    }
    .menu-toggle{display:block;z-index:10001}
    .main-nav{
        position:absolute;top:68px;left:0;width:100%;
        display:none;flex-direction:column;gap:0;
        padding:15px 0;background:#050505;
        border-bottom:1px solid #8f6b32;
    }
    .main-nav.open{display:flex}
    .main-nav a{
        width:100%;padding:16px 0;text-align:center;
        border-bottom:1px solid rgba(214,176,106,.15);
    }
    main{padding:105px 18px 45px}
    .contact-wrapper{padding:28px 22px;border-radius:18px}
    .contact-title{font-size:32px}
    .contact-subtitle{font-size:14px}
}
</style>
</head>

<body>

<header class="site-header">
    <div class="logo">
        <span class="logo-icon">♞</span>
        <span>Horse</span>
    </div>

    <!-- <span class="explore-menu">Explore more →</span> -->

    <button class="menu-toggle" type="button" aria-label="Open menu">☰</button>

    <nav class="main-nav">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./horse.html">Breeds</a>
        <a href="./gallery.html">Gallery</a>
        <a href="./contact.html" class="active">Contact</a>
    </nav>
</header>

<main>
    <div class="contact-wrapper">

        <h1 class="contact-title">Contact Me</h1>

        <p class="contact-subtitle">
            Have a question or want to get in touch?
            Send me a message.
        </p>

        <form class="contact-form">

            <label for="Name">Name</label>
            <input type="text" placeholder="Enter your name" id="Name" name="name">

            <label for="email">Email</label>
            <input type="email" placeholder="Enter your email" id="email" name="email">

            <label for="password">Password</label>
            <input type="password" placeholder="Enter your password" id="password" name="password">

            <!-- <label for="number">Number</label>
            <input type="number" placeholder="Enter your number" id="number" name="number"> -->

            <label for="messege">Message</label>
            <textarea name="message" id="messege" placeholder="Enter your message"></textarea>

            <button type="submit" class="send-button">Send</button>
        </form>

        <div class="social-section">
            <!-- <h2>Let's Stay Connected</h2>
            <h2>You can also find me here:</h2> -->
            <p>You can also find me here:</p>

            <div class="social-links">
                <a href="#" class="social-link" target="_blank">
                    Telegram: @S_nazfuroosh
                </a>

                <a href="#" class="social-link" target="_blank">
                    Instagram: @setayesh.8n
                </a>
            </div>
        </div>

    </div>
</main>

<script>
const menuToggle = document.querySelector(".menu-toggle");
const mainNav = document.querySelector(".main-nav");

menuToggle.onclick = function(){
    mainNav.classList.toggle("open");
    menuToggle.classList.toggle("open");
};
</script>

</body>
</html>
